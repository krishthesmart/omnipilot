name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # OmniPilot runs as a background service on macOS and Linux (Windows users host it on a
        # server or Task Scheduler -- see scripts/service.mjs), so CI covers those two.
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Python 3.12 so `python3` (used by projectCheck) has sys.stdlib_module_names, and uv for the
      # engine's pytest suite (`npm run test:engine`).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run package:extension
      - name: Python SDK compiles
        shell: bash
        run: python3 -m py_compile sdk/python/omnipilot.py || python -m py_compile sdk/python/omnipilot.py
